# Publishes to npm through repalash/release-tools when the version in package.json is not on npm
# yet, after approval of the npm-publish environment. Each version gets a GitHub release v<version>
# with the tarball.
name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write # GitHub releases
      id-token: write # npm trusted publishing
    uses: repalash/release-tools/.github/workflows/npm-release.yml@88b8bf258410968d4acf127b31c4c4ca81666962 # v1
    with:
      build: npm ci && npm test
      tag-format: 'v{version}'
      github-release: true
    secrets: inherit
