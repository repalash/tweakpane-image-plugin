on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

name: Create Release

jobs:
  build:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Pack
        # `--silent` drops the npm notice tarball-contents listing so only the tarball filename
        # hits stdout, which is what xargs needs. (Prepare-script logs go to stderr already.)
        run: npm pack --silent | xargs -I {} mv {} package.tgz
      - uses: ncipollo/release-action@v1
        with:
          artifacts: package.tgz
